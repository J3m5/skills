[settings]
npm.package_manager = "pnpm"

[tools]
node = "lts"
pnpm = "latest"
"npm:oxfmt" = "latest"
ruff = "latest"

[tasks.oxfmt]
run = "oxfmt"

[tasks.check]
run = ["oxfmt --check .", "ruff check .", "ruff format . --check"]

[tasks.fix]
run = ["oxfmt .", "ruff check . --fix", "ruff format ."]

[tasks.python-lint]
run = "ruff check ."

[tasks.python-format]
run = "ruff format ."

[tasks."sync:playwright-cli"]
description = "Sync the Playwright CLI skill from Microsoft's Git repository"
run = "python3 -B plugins/engineering-skills/scripts/sync_playwright_cli.py"

[tasks."sync:glab"]
description = "Sync the bundled GitLab CLI skill and split its references"
run = "python3 -B plugins/engineering-skills/scripts/sync_gitlab_skills.py glab"

[tasks."sync:gitlab-ci"]
description = "Sync the official GitLab CI skill and split its workflows"
run = "python3 -B plugins/engineering-skills/scripts/sync_gitlab_skills.py gitlab-ci-skill"
