[settings]
npm.package_manager = "pnpm"

[tools]
node = "lts"
pnpm = "latest"
"npm:oxfmt" = "latest"
ruff = "latest"

[tasks.oxfmt]
run = "oxfmt"

[tasks.check]
run = ["oxfmt --check .", "ruff check .", "ruff format . --check"]

[tasks.fix]
run = ["oxfmt .", "ruff check . --fix", "ruff format ."]

[tasks.python-lint]
run = "ruff check ."

[tasks.python-format]
run = "ruff format ."

[tasks."sync:playwright-cli"]
description = "Sync the Playwright CLI skill from Microsoft's Git repository"
run = "python3 plugins/engineering-skills/scripts/sync_playwright_cli.py"
